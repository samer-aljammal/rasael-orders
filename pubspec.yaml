name: rasael_orders
description: "Rasael Orders: the order pipeline and business dashboard behind Rasael, an Arabic gift-page studio."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Navigation
  go_router: ^17.5.0

  # Dependency injection
  get_it: ^9.2.1

  # Backend (database, auth, realtime). Optional at runtime: without keys the
  # app runs on the in-memory demo repository.
  supabase_flutter: ^2.8.0

  # Opening the customer's WhatsApp / Instagram chat and the delivered page
  url_launcher: ^6.3.2

  # Utilities
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Asset generators, run on demand, not used at runtime:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  # Bundled, not fetched: Arabic text must render correctly on first launch
  # and offline. Both families are SIL Open Font License (see assets/fonts).
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Messiri
      fonts:
        - asset: assets/fonts/ElMessiri-Variable.ttf

# App icon: the Rasael envelope and heart seal on wine, without the wordmark
# (unreadable at icon size; the launcher label says «رسائل»).
# Source art: assets/icon/, cut from the brand logo.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#561A27"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#561A27"
    theme_color: "#561A27"

# Launch screen in the app's own page colours, so Flutter's first frame
# continues it instead of flashing white.
flutter_native_splash:
  color: "#F7F2EA"
  color_dark: "#141011"
  image: assets/icon/splash.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#561A27"
    color: "#F7F2EA"
    color_dark: "#141011"
  web: false
