name: Verify and deploy the demo

# Every push to main is analysed, tested, then published to GitHub Pages as
# the public demo. The build has no Supabase keys on purpose: without them
# the app runs only on its in-memory demo orders (every name invented), so
# the public link can never reach the real business data.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK the app was built and verified against.
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      # Served from a project path, so every asset must resolve under it;
      # a wrong base-href serves a blank page.
      - run: flutter build web --release --base-href /rasael-orders/

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
